name: Aktualizace dnešních zápasů

on:
  schedule:
    # Každých 5 minut, posunuto mimo „kulaté“ minuty (méně vytížené GitHubem)
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: current-json
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stáhnout zápasy
        run: python scripts/fetch_current.py
      - name: Commit current.json
        run: |
          if [ -n "$(git status --porcelain current.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add current.json
            git commit -m "Aktualizace current.json"
            git pull --rebase
            git push
          fi

