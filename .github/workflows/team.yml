name: Stažení dat týmů z CVF API
on:
  schedule:
    # Každou hodinu, posunuto mimo „kulatou“ minutu (ta bývá vytížená GitHubem)
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: current-json
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stáhnout data týmu
        env:
          API_USERNAME: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
        run: python scripts/fetch_team.py
      - name: Commit team.json
        run: |
          if [ -n "$(git status --porcelain team.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add team.json
            git commit -m "Aktualizace team.json"
            git pull --rebase
            git push
          fi
